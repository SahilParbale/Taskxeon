<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#d1fae5" stop-opacity="0.85" />
    </linearGradient>
    <filter id="dropShadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Full Square Canvas for Maskable Adaptive Icons -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Core Layer Geometry within the 80% Safe Zone -->
  <g filter="url(#dropShadowMask)" transform="translate(51, 51) scale(0.8)">
    <!-- Bottom Layer -->
    <path d="M 136 332 L 256 392 L 376 332" fill="none" stroke="url(#accentGradMask)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    
    <!-- Middle Layer -->
    <path d="M 136 264 L 256 324 L 376 264" fill="none" stroke="url(#accentGradMask)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    
    <!-- Top Diamond / Layer -->
    <polygon points="256 128 376 188 256 248 136 188" fill="url(#accentGradMask)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />

    <!-- Central Checkmark / Velocity Needle -->
    <path d="M 232 188 L 248 204 L 284 168" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
