<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#d1fae5" stop-opacity="0.85" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#022c22" flood-opacity="0.45" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Top Highlight -->
  <path d="M 112 0 L 400 0 C 462 0 512 50 512 112 C 512 116 511 120 510 124 C 470 70 390 40 256 40 C 122 40 42 70 2 124 C 1 120 0 116 0 112 C 0 50 50 0 112 0 Z" fill="#ffffff" opacity="0.12" />

  <!-- Core Layer Geometry (TaskFlow Enterprise Stack) -->
  <g filter="url(#dropShadow)" transform="translate(0, -6)">
    <!-- Bottom Layer -->
    <path d="M 136 332 L 256 392 L 376 332" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    
    <!-- Middle Layer -->
    <path d="M 136 264 L 256 324 L 376 264" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    
    <!-- Top Diamond / Layer -->
    <polygon points="256 128 376 188 256 248 136 188" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />

    <!-- Central Checkmark / Velocity Needle -->
    <path d="M 232 188 L 248 204 L 284 168" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
